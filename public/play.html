<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#141826" />
  <title>교실 배틀</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="player">
  <!-- 입장 -->
  <section id="join" class="screen center">
    <h1 class="logo small">교실 배틀</h1>
    <form id="joinForm" class="form">
      <label>방 번호
        <input id="codeInput" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="1234" />
      </label>
      <label>내 이름
        <input id="nameInput" maxlength="10" autocomplete="off" placeholder="닉네임 (10자 이내)" />
      </label>
      <button class="btn big" type="submit">입장하기</button>
      <div id="joinError" class="error"></div>
    </form>
  </section>

  <!-- 대기실 -->
  <section id="lobby" class="screen center hidden">
    <div class="me-name" id="myName"></div>
    <div class="sub">팀을 고르고 준비 버튼을 눌러 주세요</div>
    <div class="team-pick">
      <button class="team-btn red" data-team="red">빨강팀<small id="pickRed">0명</small></button>
      <button class="team-btn blue" data-team="blue">파랑팀<small id="pickBlue">0명</small></button>
    </div>
    <button id="readyBtn" class="btn big ready-btn">준비!</button>
    <div id="lobbyInfo" class="hint"></div>
    <div class="howto">
      <b>조작법</b><br />
      왼쪽 화면 드래그: 이동<br />
      오른쪽 화면 드래그 후 손 떼기: 조준해서 발사<br />
      오른쪽 화면 톡 치기: 가까운 적 자동 조준<br />
      게임 화면은 앞의 큰 화면을 보세요!
    </div>
    <button id="leaveBtn" class="btn ghost tiny">나가기</button>
  </section>

  <!-- 컨트롤러 -->
  <section id="pad" class="screen hidden">
    <div class="pad-top">
      <div class="pad-score"><span class="r" id="sRed">0</span> : <span class="b" id="sBlue">0</span></div>
      <div class="pad-timer" id="pTimer">2:00</div>
      <div class="pad-me">
        <div class="hpbar"><div id="hpFill"></div></div>
        <div class="ammo" id="ammo"></div>
      </div>
      <div class="pad-kd" id="kd">0킬 0데스</div>
    </div>
    <div class="zones">
      <div id="moveZone" class="zone"><span>이동</span></div>
      <div id="aimZone" class="zone"><span>조준 · 발사<br /><small>톡 = 자동조준</small></span></div>
    </div>
    <div id="stickL" class="stick hidden"><div class="knob"></div></div>
    <div id="stickR" class="stick aim hidden"><div class="knob"></div></div>
    <div id="deadOverlay" class="overlay hidden"><div>쓰러졌어요!</div><div id="respawnTxt" class="big-num"></div></div>
    <div id="padCountdown" class="overlay hidden"><div>앞 화면을 보세요!</div><div id="padCd" class="big-num"></div></div>
    <div id="rotateHint" class="rotate-hint">폰을 가로로 돌리면 더 편해요</div>
  </section>

  <!-- 결과 -->
  <section id="result" class="screen center hidden">
    <div id="pWinner" class="winner"></div>
    <div id="pScore" class="final-score"></div>
    <div id="pMine" class="sub"></div>
    <div class="hint">선생님이 다음 판을 시작할 때까지 기다려 주세요</div>
  </section>

  <!-- 쫓겨남 / 방 닫힘 -->
  <section id="bye" class="screen center hidden">
    <div id="byeMsg" class="sub"></div>
    <button id="rejoinBtn" class="btn big">다시 입장</button>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="play.js"></script>
</body>
</html>
